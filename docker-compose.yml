version: '3.8'

services:
  ml-service:
    build: ./ml-service
    container_name: agrisaarthi-ml
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build: ./backend
    container_name: agrisaarthi-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CLIENT_URL=http://localhost:5173,http://localhost:3000
      - ML_API_URL=http://ml-service:8000
    depends_on:
      - ml-service

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: agrisaarthi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
